name: Release

# Dispara ao criar uma tag "v*" (ex.: v1.0.0), ou manualmente pela aba Actions.
on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            ext: zip
          - os: ubuntu-latest
            rid: linux-x64
            ext: tar.gz
          - os: macos-latest
            rid: osx-x64
            ext: tar.gz

    runs-on: ${{ matrix.os }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Publish
        run: >
          dotnet publish src/ZipP2P.App/ZipP2P.App.csproj
          -c Release
          -r ${{ matrix.rid }}
          --self-contained true
          -p:PublishSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -o publish/${{ matrix.rid }}

      - name: Package (Windows)
        if: matrix.os == 'windows-latest'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          powershell -NoProfile -Command "Compress-Archive -Path '*' -DestinationPath '../ZipStream-${{ matrix.rid }}.zip'"

      - name: Package (Linux/macOS)
        if: matrix.os != 'windows-latest'
        shell: bash
        run: |
          cd publish/${{ matrix.rid }}
          tar -czf ../ZipStream-${{ matrix.rid }}.tar.gz .

      - name: Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: |
            publish/ZipStream-win-x64.zip
            publish/ZipStream-linux-x64.tar.gz
            publish/ZipStream-osx-x64.tar.gz
