# Servidor TURN (coturn) para fallback de relay do ZipStream.
# Rode com: docker compose up -d
# Depois configure o app (settings.json) com:
#   "IceServers": ["stun:SEU_IP:3478", "turn:zipstream:CHANGE_ME@SEU_IP:3478"]
services:
  coturn:
    image: coturn/coturn:latest
    network_mode: host
    command: >
      -n --log-file=stdout
      --realm=zipstream
      --user=zipstream:CHANGE_ME
      --listening-port=3478
      --min-port=49160
      --max-port=49200
      --no-cli
      --no-tls
      --no-dtls
    restart: unless-stopped
